name: aams

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./fablab-face-attendance/.env
    environment:
      # Lock the browser console origin; add your LAN/host origin for pilots.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8090}
      - RATE_LIMIT_PER_MIN=120
      - AAMS_ENV=production
    volumes:
      - api-db:/app/database        # SQLite + backups
      - api-images:/app/images      # enrollment/evidence photos
      - insightface-models:/root/.insightface   # ~275MB, survives rebuilds
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - api
    restart: unless-stopped

  # TLS terminator — enable with: docker compose --profile tls up -d
  # Edit deploy/Caddyfile with your real hostname first.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]
    restart: unless-stopped

  # Zero-account public showcase URL. The generated trycloudflare.com URL is
  # printed by `docker compose --profile showcase logs -f tunnel-quick` and
  # remains live while this stack is running.
  tunnel-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["showcase"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on: [web]
    restart: unless-stopped

  # Stable Cloudflare Tunnel hostname. Create the tunnel in Cloudflare, route
  # its public hostname to http://web:80, then put the token in the root .env.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    restart: unless-stopped

volumes:
  api-db:
  api-images:
  insightface-models:
  caddy-data:
  caddy-config:
