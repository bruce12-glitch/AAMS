name: Deploy console to GitHub Pages

# Static demo build of the AAMS console.
# No backend, no database, no biometric data - the UI renders sample data
# from src/api/mock.js so the interface can be reviewed from a public link.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
#   "GitHub Actions"
#
# Then either push to main, or run this workflow manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Pages target)
        env:
          # Switches vite base to './' and disables the API health probe.
          VITE_TARGET: pages
        run: npm run build

      - name: Add .nojekyll
        # Stops Jekyll from ignoring files that begin with an underscore.
        run: touch dist/.nojekyll

      - name: Add SPA fallback
        # GitHub Pages serves 404.html for unknown paths, which keeps
        # client-side navigation working on deep links and refreshes.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
